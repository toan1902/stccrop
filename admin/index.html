<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản trị nội dung | STC CROP</title><link rel="stylesheet" href="/admin/style.css"></head>
<body>
<section id="loginView" class="login-shell"><form id="loginForm" class="login-card"><div class="brand"><span>STC</span> CROP</div><h1>Đăng nhập quản trị</h1><p>Quản lý và xuất bản bài viết trên stccrop.com</p><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Mật khẩu<input id="password" type="password" autocomplete="current-password" required></label><button type="submit">Đăng nhập</button><div id="loginError" class="error" role="alert"></div><small style="display:block;margin-top:18px;color:#8a98a8">Phiên bản đăng nhập: 3.0</small></form></section>
<div id="appView" class="app" hidden>
  <aside><div class="brand"><span>STC</span> CROP</div><nav><button class="nav active" data-view="posts">Bài viết</button><button class="nav" data-view="editor">Viết bài mới</button><a class="nav" href="/tin-tuc.html" target="_blank">Xem trang tin</a></nav><button id="logout" class="logout">Đăng xuất</button></aside>
  <main><header><div><small>TRANG QUẢN TRỊ</small><h1 id="pageTitle">Bài viết</h1></div><button id="newPost" class="primary">+ Viết bài mới</button></header>
    <section id="postsView"><div class="stats"><article><span>Tổng bài</span><strong id="totalCount">0</strong></article><article><span>Đã xuất bản</span><strong id="publishedCount">0</strong></article><article><span>Bản nháp</span><strong id="draftCount">0</strong></article></div><div class="panel"><div class="toolbar"><input id="search" placeholder="Tìm theo tiêu đề..."><select id="statusFilter"><option value="all">Tất cả trạng thái</option><option value="published">Đã xuất bản</option><option value="draft">Bản nháp</option></select></div><div class="table-wrap"><table><thead><tr><th>Tiêu đề</th><th>Trạng thái</th><th>Ngày cập nhật</th><th></th></tr></thead><tbody id="postRows"></tbody></table></div><p id="emptyState" class="empty" hidden>Chưa có bài viết.</p></div></section>
    <section id="editorView" hidden><form id="postForm" class="editor"><input id="postId" type="hidden"><div class="editor-main"><div class="panel fields"><label>Tiêu đề<input id="title" required maxlength="180"></label><label>Đường dẫn (slug)<input id="slug" required pattern="[a-z0-9-]+"></label><label>Tóm tắt<textarea id="excerpt" rows="3" maxlength="320"></textarea></label><label>Nội dung HTML<textarea id="content" rows="18" required placeholder="<p>Nội dung bài viết...</p>"></textarea></label></div></div><aside class="editor-side"><div class="panel fields"><label>Trạng thái<select id="status"><option value="draft">Bản nháp</option><option value="published">Xuất bản</option></select></label><label>Ngày bài viết<input id="publishedAt" type="datetime-local"></label><label>Ảnh đại diện<input id="coverFile" type="file" accept="image/jpeg,image/png,image/webp"></label><input id="coverUrl" type="url" placeholder="Hoặc dán URL ảnh"><img id="coverPreview" alt="Xem trước ảnh" hidden><button type="submit" class="primary">Lưu bài viết</button><button id="cancelEdit" type="button" class="secondary">Hủy</button><div id="saveMessage" class="message" role="status"></div></div></aside></form></section>
  </main>
</div>
<script src="/stc-config.js?v=3"></script><script src="/admin/app-v3.js"></script></body></html>

<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tin tức | STC CROP</title><meta name="description" content="Tin tức và hoạt động mới nhất của STC CROP."><style>:root{--ink:#10202e;--blue:#176bba;--cyan:#1ba6d9;--muted:#687789;--line:#dce5ec}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:Arial,sans-serif}header{background:#091a29;color:#fff}.bar{max-width:1120px;margin:auto;padding:20px 24px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:22px;font-weight:900}.brand span{color:var(--cyan)}a{color:inherit}.bar a{text-decoration:none}.hero{padding:72px 24px;background:linear-gradient(135deg,#0b2338,#176bba);color:#fff}.hero div,main{max-width:1120px;margin:auto}.hero h1{font-size:clamp(36px,6vw,68px);margin:0}.hero p{color:#c9dbea;font-size:18px}main{padding:48px 24px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}.card{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}.card img{width:100%;height:210px;object-fit:cover}.body{padding:20px}.meta{color:var(--blue);font-size:13px;font-weight:800}.card h2{font-size:21px;line-height:1.35}.card p{color:var(--muted);line-height:1.6}.card a{text-decoration:none}.article{max-width:820px}.article h1{font-size:clamp(34px,6vw,58px);line-height:1.08}.article .cover{width:100%;max-height:520px;object-fit:cover;border-radius:12px;margin:24px 0}.content{font-family:Arial,Helvetica,sans-serif;font-size:18px;line-height:1.8}.empty{text-align:center;color:var(--muted);padding:70px 0}@media(max-width:800px){.grid{grid-template-columns:1fr}.hero{padding:48px 20px}}</style></head><body><header><div class="bar"><div class="brand"><span>STC</span> CROP</div><a href="/">Trang chủ</a></div></header><section class="hero"><div><h1>Tin tức</h1><p>Cập nhật hoạt động và những câu chuyện mới từ STC CROP.</p></div></section><main id="content"><p class="empty">Đang tải bài viết...</p></main><script>const root=document.getElementById('content'),esc=s=>String(s??'').replace(/[&<>\"]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[x])),slug=new URLSearchParams(location.search).get('bai');async function get(path){const r=await fetch('/api/stc?path='+encodeURIComponent('/rest/v1/'+path));if(!r.ok)throw new Error();return r.json()}(async()=>{try{if(slug){const a=await get(`posts?select=*&slug=eq.${encodeURIComponent(slug)}&status=eq.published&limit=1`),p=a[0];if(!p)throw new Error();document.title=p.title+' | STC CROP';root.className='article';root.innerHTML=`<div class="meta">${new Date(p.published_at).toLocaleDateString('vi-VN')}</div><h1>${esc(p.title)}</h1>${p.cover_url?`<img class="cover" src="${esc(p.cover_url)}" alt="">`:''}<div class="content">${p.content_html}</div>`}else{const a=await get('posts?select=title,slug,excerpt,cover_url,published_at&status=eq.published&order=published_at.desc');root.innerHTML=a.length?`<div class="grid">${a.map(p=>`<article class="card">${p.cover_url?`<img src="${esc(p.cover_url)}" alt="">`:''}<div class="body"><div class="meta">${new Date(p.published_at).toLocaleDateString('vi-VN')}</div><h2><a href="?bai=${encodeURIComponent(p.slug)}">${esc(p.title)}</a></h2><p>${esc(p.excerpt)}</p></div></article>`).join('')}</div>`:'<p class="empty">Chưa có bài viết được xuất bản.</p>'}}catch{root.innerHTML='<p class="empty">Không tải được bài viết. Vui lòng thử lại sau.</p>'}})()</script></body></html>
